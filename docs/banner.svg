<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Web Code Studio" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303030"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="w" x1="14" y1="22" x2="50" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9c9c9c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- logo -->
  <g transform="translate(76 86) scale(2.5)">
    <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#tile)" stroke="url(#tb)" stroke-width="1.5"/>
    <path d="M13 22 22.5 46 32 28 41.5 46 51 22" fill="none" stroke="url(#w)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="29.8" y="13" width="4.4" height="10" rx="2.2" fill="#fff"/>
  </g>

  <!-- text -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="272" y="150" font-size="60" font-weight="800" letter-spacing="5" fill="#ffffff">WEB CODE STUDIO</text>
    <text x="274" y="200" font-size="25" fill="#b8b8b8">Code web ngay trên trình duyệt, kể cả trên điện thoại</text>

    <g font-size="17" font-weight="600" fill="#e8e8e8">
      <rect x="274" y="232" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="369" y="258" text-anchor="middle">HTML · CSS · JS</text>
      <rect x="478" y="232" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="553" y="258" text-anchor="middle">Live Preview</text>
      <rect x="642" y="232" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="717" y="258" text-anchor="middle">Không backend</text>
    </g>
  </g>

  <!-- phone -->
  <g>
    <rect x="958" y="30" width="214" height="300" rx="34" fill="#0c0c0c" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="970" y="42" width="190" height="276" rx="24" fill="#121212"/>
    <rect x="1031" y="50" width="68" height="8" rx="4" fill="#000"/>

    <!-- code area -->
    <g>
      <rect x="984" y="74" width="60" height="7" rx="3.5" fill="#8a8a8a"/>
      <rect x="996" y="90" width="92" height="7" rx="3.5" fill="#d9d9d9"/>
      <rect x="996" y="106" width="70" height="7" rx="3.5" fill="#bdbdbd"/>
      <rect x="1008" y="122" width="104" height="7" rx="3.5" fill="#d9d9d9"/>
      <rect x="996" y="138" width="48" height="7" rx="3.5" fill="#8a8a8a"/>
      <rect x="984" y="154" width="40" height="7" rx="3.5" fill="#8a8a8a"/>
    </g>

    <line x1="970" y1="176" x2="1160" y2="176" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="984" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">LIVE PREVIEW</text>

    <!-- preview card -->
    <rect x="984" y="204" width="162" height="102" rx="10" fill="#f3f3f3"/>
    <rect x="998" y="220" width="84" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="998" y="240" width="130" height="6" rx="3" fill="#b5b5b5"/>
    <rect x="998" y="254" width="110" height="6" rx="3" fill="#b5b5b5"/>
    <rect x="998" y="274" width="62" height="20" rx="10" fill="#1a1a1a"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Sơ đồ bố cục giao diện Web Code Studio" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303030"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="w" x1="14" y1="22" x2="50" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9c9c9c"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .lbl{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#8a8a8a}
    .t{font-size:14px;fill:#d6d6d6}
    .tm{font-size:14px;fill:#8f8f8f}
  </style>

  <rect width="1200" height="620" rx="22" fill="#050505"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".14"/>

  <!-- header -->

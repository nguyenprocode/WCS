    <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#tile)" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M13 22 22.5 46 32 28 41.5 46 51 22" fill="none" stroke="url(#w)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="29.8" y="13" width="4.4" height="10" rx="2.2" fill="#fff"/>
  </g>
  <text class="sans" x="78" y="48" font-size="15" font-weight="800" letter-spacing="2" fill="#fff">WEB CODE STUDIO</text>
  <g fill="none" stroke="#bdbdbd" stroke-width="1.6">
    <rect x="1048" y="30" width="28" height="24" rx="7" stroke-opacity=".6"/>
    <rect x="1088" y="30" width="28" height="24" rx="7" stroke-opacity=".6"/>
    <rect x="1128" y="30" width="28" height="24" rx="7" stroke-opacity=".6"/>
